<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8442f" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,100;1,9..144,400..600,100&family=Nunito:wght@400;600;700;800&family=Shrikhand&display=swap"
    />
    <title>Lunchtipset</title>
    <script>
      // Set the theme before first paint so the page doesn't flash; see src/theme.ts.
      document.documentElement.dataset.theme = (() => {
        try {
          const t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') return t
        } catch {}
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
